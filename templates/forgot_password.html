{% extends "base.html" %}

{% block login_content %}
<div class="login-page">
    <div class="login-card animate-in">
        <div class="text-center mb-4">
            <div class="login-logo">
                <i class="fa-solid fa-key"></i>
            </div>
            <h3 class="login-title">Quên Mật Khẩu</h3>
            <p class="login-subtitle">Gửi yêu cầu đặt lại mật khẩu</p>
        </div>

        <div class="card border-0" style="box-shadow: var(--shadow-lg);">
            <div class="card-body p-4">
                <form method="POST" action="{{ url_for('account_request.forgot_password') }}">
                    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}" />
                    
                    <div class="mb-3">
                        <label for="username" class="form-label fw-bold">Tài khoản</label>
                        <input type="text" class="form-control" id="username" name="username" placeholder="Nhập tên đăng nhập của bạn" required>
                    </div>
                    
                    <div class="mb-4">
                        <label for="email" class="form-label fw-bold">Email nhận thông báo</label>
                        <input type="email" class="form-control" id="email" name="email" placeholder="Nhập email của bạn" required>
                    </div>

                    <button type="submit" class="btn login-btn w-100 mt-2">
                        <i class="fa-solid fa-paper-plane"></i> GỬI YÊU CẦU
                    </button>
                </form>
            </div>
        </div>

        <p class="text-center mt-4">
            <a href="{{ url_for('auth.login') }}" class="text-accent" style="text-decoration: none;">
                <i class="fa-solid fa-arrow-left me-1"></i>Quay lại đăng nhập
            </a>
        </p>
    </div>
</div>
{% endblock %}
